server:
  port: 8080

spring:
  application:
    name: salestorm
  datasource:
    url: jdbc:h2:mem:salestormdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

salestorm:
  demo:
    enabled: true
  sale:
    total-stock: 100
    reservation-ttl-seconds: 300
    payment-grace-seconds: 600
    pricing-type: FLAT
    base-unit-price: 99.99
    deal-discount-percentage: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
